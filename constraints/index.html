

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Constraints! - With Dictionary Check</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #161f30;
      --border: #26354a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --error: #ef4444;
      --gold: #f59e0b;
      --tile-bg: #223049;
      --tile-hit: #15803d;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Back to Arcade Nav Link */
    .top-nav {
      display: flex;
      align-items: center;
      margin-bottom: -0.25rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      background: #111827;
      padding: 0.35rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      flex: 1;
      padding: 0.55rem 1rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: var(--card);
      color: var(--accent);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    header { text-align: center; }
    h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
    p.subtitle { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .tiles-wrapper {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .tile {
      flex: 1;
      aspect-ratio: 1;
      max-width: 60px;
      background: var(--tile-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 800;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 3px 0 #0a0e17;
    }

    .tile.completed {
      background: var(--tile-hit);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 5px 0 #052e16;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button.action-btn {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.action-btn:hover { background: var(--accent-hover); }
    button.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    textarea {
      width: 100%;
      height: 90px;
      background: #0b0f17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      color: var(--text);
      font-size: 1.05rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }

    .preview-box {
      min-height: 44px;
      padding: 0.65rem;
      background: #0b0f17;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1.05rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .hit {
      background: rgba(34, 197, 94, 0.25);
      color: var(--success);
      font-weight: 800;
      padding: 0 2px;
      border-radius: 3px;
      text-decoration: underline;
    }

    .invalid-word-pill {
      font-size: 0.8rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      display: inline-block;
      margin: 0.2rem 0.25rem 0.2rem 0;
    }

    .stats {
      display: flex;
      gap: 1.25rem;
      font-size: 0.85rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .stats span strong { color: var(--text); }

    .status-badge {
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.8rem;
      text-align: center;
    }
    .status-badge.in-progress { background: #223049; color: var(--muted); }
    .status-badge.valid { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
    .status-badge.invalid { background: rgba(239, 68, 68, 0.2); color: var(--error); border: 1px solid var(--error); }

    .submissions-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.5rem;
    }

    .submission-item {
      background: #0b0f17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: border-color 0.2s ease;
    }
    .submission-item.is-shortest {
      border: 1px solid var(--gold);
      background: rgba(245, 158, 11, 0.04);
    }
    .submission-item.is-final { outline: 2px solid var(--accent); }

    .shortest-tag {
      background: var(--gold);
      color: #000;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-left: 0.4rem;
    }

    .submission-content { flex: 1; font-size: 0.95rem; }
    .submission-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Back to Arcade link -->
  <nav class="top-nav">
    <a href="../index.html" class="back-link">
      &larr; Back to Arcade
    </a>
  </nav>

  <div class="mode-bar">
    <button class="mode-btn active" id="dailyModeBtn">Daily Challenge</button>
    <button class="mode-btn" id="freeModeBtn">Free Play (Practice)</button>
  </div>

  <header>
    <h1>CONSTRAINTS!</h1>
    <p class="subtitle" id="rollMetaInfo">Daily Puzzle</p>
  </header>

  <!-- Roll Display -->
  <div class="card">
    <div class="tiles-wrapper" id="tilesContainer"></div>
    <div class="controls">
      <span style="font-size: 0.85rem; color: var(--muted);" id="modeDesc">Same letters for all players today.</span>
      <button class="action-btn" id="reRollBtn" style="display: none;">Roll Again</button>
    </div>
  </div>

  <!-- Main Game Input Card -->
  <div class="card" style="display: flex; flex-direction: column; gap: 0.75rem;">
    <textarea id="inputArea" placeholder="Type your sentence or paragraph here..."></textarea>
    
    <div style="font-size: 0.8rem; color: var(--muted); font-weight: 700; letter-spacing: 0.05em;">LETTER TRACKER</div>
    <div class="preview-box" id="previewBox"></div>

    <!-- Dict warning area -->
    <div id="dictionaryFeedback" style="display: none;">
      <span style="font-size: 0.8rem; color: var(--error); font-weight: 600;">Unrecognized words: </span>
      <div id="invalidWordsList" style="margin-top: 0.3rem;"></div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
      <div class="stats">
        <span>Words: <strong id="wordCount">0</strong></span>
        <span>Letters: <strong id="letterCount">0</strong></span>
        <span>Characters: <strong id="charCount">0</strong></span>
      </div>
      <div id="statusBadge" class="status-badge in-progress">0 / 7 Letters Found</div>
    </div>

    <button class="action-btn" id="submitBtn" disabled style="margin-top: 0.4rem; width: 100%;">+ Save as Valid Entry</button>
  </div>

  <!-- Saved Drafts -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-weight: 700; font-size: 0.95rem;">Your Entries for this Roll</span>
      <span style="font-size: 0.8rem; color: var(--muted);">Pick your final answer</span>
    </div>

    <div class="submissions-list" id="submissionsList">
      <div style="color: var(--muted); font-size: 0.85rem; padding: 0.75rem 0;" id="emptySubmissionsMsg">
        No entries saved yet. Sequence must be complete and all words in dictionary.
      </div>
    </div>
  </div>
</div>

<script type="module">
  let wordSet = new Set();
  
  try {
    const module = await import('../shared/dictionary.js');
    const dictData = module.DICTIONARY || module.default || module.words;
    if (dictData instanceof Set) {
      wordSet = dictData;
    } else if (Array.isArray(dictData)) {
      wordSet = new Set(dictData.map(w => w.toLowerCase()));
    }
  } catch (err) {
    console.warn("Could not load ../shared/dictionary.js directly.", err);
  }

  const TILE_POOL = "AAAAAAAAABBCCDDDDEEEEEEEEEEEEFFGGGHHIIIIIIIIIJKLLLLMMNNNNNNOOOOOOOOPPQRRRRRRSSSSTTTTTTUUUUVVWWXYYZ";
  const TILE_COUNT = 7;

  let isDaily = true;
  let currentTarget = [];
  let submissions = [];
  let finalIndex = 0;

  function getDateSeed() {
    const now = new Date();
    return now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  }

  function seededRandom(seed) {
    let s = seed % 2147483647;
    if (s <= 0) s += 2147483646;
    return function() {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }

  function getStorageKey() {
    return isDaily ? `constraints_daily_${getDateSeed()}` : 'constraints_freeplay';
  }

  function persistState() {
    const state = {
      target: currentTarget,
      submissions: submissions,
      finalIndex: finalIndex,
      draftText: document.getElementById("inputArea").value
    };
    try {
      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    } catch (e) {
      console.warn("Unable to save to localStorage", e);
    }
  }

  function loadPersistedState() {
    try {
      const raw = localStorage.getItem(getStorageKey());
      if (!raw) return false;
      const state = JSON.parse(raw);
      if (!state) return false;

      if (!isDaily && state.target && state.target.length === TILE_COUNT) {
        currentTarget = state.target;
      }
      submissions = state.submissions || [];
      finalIndex = typeof state.finalIndex === 'number' ? state.finalIndex : 0;
      document.getElementById("inputArea").value = state.draftText || "";
      return true;
    } catch (e) {
      console.warn("Failed reading localStorage", e);
      return false;
    }
  }

  function generateLetters(forceNewRoll = false) {
    const hasSavedState = !forceNewRoll && loadPersistedState();

    if (!hasSavedState) {
      currentTarget = [];
      submissions = [];
      finalIndex = 0;
      document.getElementById("inputArea").value = "";

      if (isDaily) {
        const seed = getDateSeed();
        const rand = seededRandom(seed);
        for (let i = 0; i < TILE_COUNT; i++) {
          const idx = Math.floor(rand() * TILE_POOL.length);
          currentTarget.push(TILE_POOL[idx]);
        }
      } else {
        for (let i = 0; i < TILE_COUNT; i++) {
          const idx = Math.floor(Math.random() * TILE_POOL.length);
          currentTarget.push(TILE_POOL[idx]);
        }
      }
      persistState();
    }

    if (isDaily) {
      const todayStr = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById("rollMetaInfo").innerText = `Daily Puzzle — ${todayStr}`;
      document.getElementById("modeDesc").innerText = "Same letters for all players today. Progress saved locally.";
      document.getElementById("reRollBtn").style.display = "none";
    } else {
      document.getElementById("rollMetaInfo").innerText = "Free Play — Unlimited Rolls";
      document.getElementById("modeDesc").innerText = "Practice and test different constraints.";
      document.getElementById("reRollBtn").style.display = "inline-block";
    }

    renderTiles();
    validateText();
    renderSubmissions();
  }

  function renderTiles(matchedCount = 0) {
    const container = document.getElementById("tilesContainer");
    container.innerHTML = "";
    currentTarget.forEach((char, idx) => {
      const tile = document.createElement("div");
      tile.className = "tile" + (idx < matchedCount ? " completed" : "");
      tile.innerText = char;
      container.appendChild(tile);
    });
  }

  function validateText() {
    const text = document.getElementById("inputArea").value;
    const previewBox = document.getElementById("previewBox");
    const statusBadge = document.getElementById("statusBadge");
    const submitBtn = document.getElementById("submitBtn");
    const dictFeedback = document.getElementById("dictionaryFeedback");
    const invalidWordsList = document.getElementById("invalidWordsList");

    let targetIdx = 0;
    let highlightedHtml = "";

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (targetIdx < currentTarget.length && char.toUpperCase() === currentTarget[targetIdx]) {
        highlightedHtml += `<span class="hit">${char}</span>`;
        targetIdx++;
      } else {
        highlightedHtml += char === "\n" ? "<br/>" : (char === " " ? "&nbsp;" : char);
      }
    }

    previewBox.innerHTML = highlightedHtml || `<span style="color: var(--muted);">Letters light up green as you match them...</span>`;
    renderTiles(targetIdx);

    const extractedWords = text.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || [];
    const invalidWords = [];

    if (wordSet.size > 0 && extractedWords.length > 0) {
      for (const w of extractedWords) {
        if (!wordSet.has(w.toLowerCase())) {
          invalidWords.push(w);
        }
      }
    }

    if (invalidWords.length > 0) {
      dictFeedback.style.display = "block";
      invalidWordsList.innerHTML = invalidWords.map(w => `<span class="invalid-word-pill">${w}</span>`).join("");
    } else {
      dictFeedback.style.display = "none";
      invalidWordsList.innerHTML = "";
    }

    const lettersOnly = (text.match(/[a-zA-Z]/g) || []).length;
    document.getElementById("wordCount").innerText = extractedWords.length;
    document.getElementById("letterCount").innerText = lettersOnly;
    document.getElementById("charCount").innerText = text.length;

    const sequenceSolved = targetIdx === currentTarget.length;
    const allWordsValid = invalidWords.length === 0 && extractedWords.length > 0;
    const canSubmit = sequenceSolved && allWordsValid;

    submitBtn.disabled = !canSubmit;

    if (canSubmit) {
      statusBadge.className = "status-badge valid";
      statusBadge.innerText = "✓ Sequence Solved & Words Verified!";
    } else if (sequenceSolved && !allWordsValid) {
      statusBadge.className = "status-badge invalid";
      statusBadge.innerText = "Invalid English word(s) detected";
    } else {
      statusBadge.className = "status-badge in-progress";
      statusBadge.innerText = `${targetIdx} / ${currentTarget.length} Letters Found`;
    }

    persistState();
  }

  function addSubmission() {
    const text = document.getElementById("inputArea").value.trim();
    if (!text) return;

    const words = (text.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || []).length;
    const letters = (text.match(/[a-zA-Z]/g) || []).length;
    const chars = text.length;

    submissions.push({ text, words, letters, chars });
    finalIndex = submissions.length - 1;

    document.getElementById("inputArea").value = "";
    validateText();
    renderSubmissions();
    persistState();
  }

  function renderSubmissions() {
    const list = document.getElementById("submissionsList");
    const shareContainer = document.getElementById("shareContainer");

    if (submissions.length === 0) {
      list.innerHTML = `<div style="color: var(--muted); font-size: 0.85rem; padding: 0.75rem 0;">No entries saved yet. Sequence must be complete and all words in dictionary.</div>`;
      if (shareContainer) shareContainer.style.display = "none";
      return;
    }

    if (shareContainer) shareContainer.style.display = "block";

    let minScore = Infinity;
    let shortestIdx = -1;

    submissions.forEach((item, idx) => {
      const score = item.words * 1000 + item.letters;
      if (score < minScore) {
        minScore = score;
        shortestIdx = idx;
      }
    });

    list.innerHTML = "";
    submissions.forEach((item, idx) => {
      const isShortest = idx === shortestIdx;
      const isFinal = idx === finalIndex;

      const row = document.createElement("div");
      row.className = `submission-item ${isShortest ? "is-shortest" : ""} ${isFinal ? "is-final" : ""}`;

      row.innerHTML = `
        <input type="radio" name="finalSelection" ${isFinal ? "checked" : ""} style="cursor: pointer;" title="Select as final entry" />
        <div class="submission-content">
          <div>
            <strong>"${item.text}"</strong>
            ${isShortest ? '<span class="shortest-tag">Shortest</span>' : ''}
          </div>
          <div class="submission-meta">
            ${item.words} words &bull; ${item.letters} letters &bull; ${item.chars} total characters
          </div>
        </div>
      `;

      row.querySelector('input').addEventListener('change', () => {
        finalIndex = idx;
        renderSubmissions();
        persistState();
      });

      list.appendChild(row);
    });
  }

  function shareResult() {
    if (submissions.length === 0) return;
    const finalSub = submissions[finalIndex] || submissions[0];
    const dateStr = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    const tilesEmoji = currentTarget.map(() => "🟩").join(" ");

    const shareText = `Constraints! (${dateStr})\n` +
                      `Letters: ${currentTarget.join(" - ")}\n` +
                      `${tilesEmoji}\n\n` +
                      `"${finalSub.text}"\n` +
                      `(${finalSub.words} words)`;

    navigator.clipboard.writeText(shareText).then(() => {
      const shareBtn = document.getElementById("shareBtn");
      const originalText = shareBtn.innerText;
      shareBtn.innerText = "✓ Copied to Clipboard!";
      shareBtn.style.background = "var(--success)";
      shareBtn.style.color = "#fff";
      setTimeout(() => {
        shareBtn.innerText = originalText;
        shareBtn.style.background = "";
        shareBtn.style.color = "";
      }, 2000);
    }).catch(err => {
      console.error("Failed to copy", err);
      alert("Could not copy to clipboard automatically.");
    });
  }

  document.getElementById("inputArea").addEventListener("input", validateText);
  document.getElementById("submitBtn").addEventListener("click", addSubmission);
  
  // Create share button event listener if present
  const shareBtnElem = document.getElementById("shareBtn");
  if (shareBtnElem) {
    shareBtnElem.addEventListener("click", shareResult);
  }

  document.getElementById("dailyModeBtn").addEventListener("click", () => {
    if (isDaily) return;
    isDaily = true;
    document.getElementById("dailyModeBtn").classList.add("active");
    document.getElementById("freeModeBtn").classList.remove("active");
    generateLetters();
  });

  document.getElementById("freeModeBtn").addEventListener("click", () => {
    if (!isDaily) return;
    isDaily = false;
    document.getElementById("freeModeBtn").classList.add("active");
    document.getElementById("dailyModeBtn").classList.remove("active");
    generateLetters();
  });

  document.getElementById("reRollBtn").addEventListener("click", () => {
    generateLetters(true);
  });

  generateLetters();
</script>
