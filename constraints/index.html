

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Constraints! Prototype</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --tile-bg: #334155;
      --tile-hit: #15803d;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header { text-align: center; }
    h1 { margin: 0; font-size: 2.2rem; letter-spacing: -0.03em; }
    p.subtitle { margin: 0.4rem 0 0; color: var(--muted); font-size: 0.95rem; }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    /* Tiles Display */
    .tiles-wrapper {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .tile {
      flex: 1;
      aspect-ratio: 1;
      max-width: 64px;
      background: var(--tile-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 3px 0 #0f172a;
    }

    .tile.completed {
      background: var(--tile-hit);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 5px 0 #052e16;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
    }

    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.65rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }

    textarea {
      width: 100%;
      height: 100px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.85rem;
      color: var(--text);
      font-size: 1.1rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }

    /* Live Output & Highlighter */
    .preview-box {
      min-height: 48px;
      padding: 0.75rem;
      background: #090d16;
      border-radius: 8px;
      font-size: 1.1rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .hit {
      background: rgba(34, 197, 94, 0.25);
      color: var(--success);
      font-weight: 800;
      padding: 0 1px;
      border-radius: 3px;
      text-decoration: underline;
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .stats span strong { color: var(--text); }

    .status-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      text-align: center;
    }
    .status-badge.in-progress { background: #334155; color: var(--muted); }
    .status-badge.valid { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-badge.warn { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>CONSTRAINTS!</h1>
    <p class="subtitle">Write a coherent line using the 7 letters in strict order.</p>
  </header>

  <div class="card">
    <div class="tiles-wrapper" id="tilesContainer"></div>
    <div class="controls">
      <button id="rollBtn">Roll 7 New Letters</button>
    </div>
  </div>

  <div class="card" style="display: flex; flex-direction: column; gap: 0.75rem;">
    <textarea id="inputArea" placeholder="Type your sentence here..."></textarea>
    
    <div style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">SEQUENCE TRACKER</div>
    <div class="preview-box" id="previewBox"></div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="stats">
        <span>Words: <strong id="wordCount">0</strong></span>
        <span>Characters: <strong id="charCount">0</strong></span>
      </div>
      <div id="statusBadge" class="status-badge in-progress">Waiting for letters...</div>
    </div>
  </div>
</div>

<script>
  // English tile distribution pool (Scrabble proportions) to avoid unplayable letter racks
  const TILE_POOL = "AAAAAAAAABBCCDDDDEEEEEEEEEEEEFFGGGHHIIIIIIIIIJKLLLLMMNNNNNNOOOOOOOOPPQRRRRRRSSSSTTTTTTUUUUVVWWXYYZ";
  const TILE_COUNT = 7;

  let currentTarget = [];

  function rollLetters() {
    currentTarget = [];
    for (let i = 0; i < TILE_COUNT; i++) {
      const idx = Math.floor(Math.random() * TILE_POOL.length);
      currentTarget.push(TILE_POOL[idx]);
    }
    renderTiles();
    validateText();
  }

  function renderTiles(matchedCount = 0) {
    const container = document.getElementById("tilesContainer");
    container.innerHTML = "";
    currentTarget.forEach((char, idx) => {
      const tile = document.createElement("div");
      tile.className = "tile" + (idx < matchedCount ? " completed" : "");
      tile.innerText = char;
      container.appendChild(tile);
    });
  }

  function validateText() {
    const text = document.getElementById("inputArea").value;
    const previewBox = document.getElementById("previewBox");
    const statusBadge = document.getElementById("statusBadge");
    
    let targetIdx = 0;
    let highlightedHtml = "";

    // Track sequential letters in text
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (targetIdx < currentTarget.length && char.toUpperCase() === currentTarget[targetIdx]) {
        highlightedHtml += `<span class="hit">${char}</span>`;
        targetIdx++;
      } else {
        highlightedHtml += char === "\n" ? "<br/>" : (char === " " ? "&nbsp;" : char);
      }
    }

    previewBox.innerHTML = highlightedHtml || `<span style="color: var(--muted);">Letters will highlight as you match them...</span>`;
    renderTiles(targetIdx);

    // Compute metrics
    const trimmed = text.trim();
    const words = trimmed ? trimmed.split(/\s+/).length : 0;
    document.getElementById("wordCount").innerText = words;
    document.getElementById("charCount").innerText = text.length;

    // Update Status
    if (targetIdx === currentTarget.length) {
      statusBadge.className = "status-badge valid";
      statusBadge.innerText = "✓ Sequence Solved!";
    } else {
      statusBadge.className = "status-badge in-progress";
      statusBadge.innerText = `${targetIdx} / ${currentTarget.length} Letters Found`;
    }
  }

  // Event Listeners
  document.getElementById("rollBtn").addEventListener("click", () => {
    rollLetters();
    document.getElementById("inputArea").value = "";
    validateText();
  });

  document.getElementById("inputArea").addEventListener("input", validateText);

  // Initial setup
  rollLetters();
</script>
</body>
</html>
