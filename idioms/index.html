

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost in Translation: Global Idioms</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 2.25rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 560px;
      text-align: center;
      position: relative;
    }
    .scoreboard {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 1.25rem;
      padding: 0 4px;
    }
    .lang-badge {
      display: inline-block;
      background: #334155;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid #475569;
    }
    .idiom-box {
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      padding: 1.25rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .literal-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #64748b;
      font-weight: bold;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }
    .idiom-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0;
      line-height: 1.4;
    }
    .original-text {
      font-size: 0.9rem;
      color: #94a3b8;
      font-style: italic;
      margin-top: 6px;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .option-btn {
      background: #334155;
      color: #f8fafc;
      border: 2px solid #475569;
      padding: 14px 16px;
      font-size: 0.98rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      line-height: 1.35;
    }
    .option-btn:hover:not(:disabled) {
      background: #475569;
      border-color: #64748b;
    }
    .option-btn.correct {
      background: #065f46 !important;
      border-color: #10b981 !important;
      color: #d1fae5 !important;
    }
    .option-btn.wrong {
      background: #881337 !important;
      border-color: #f43f5e !important;
      color: #ffe4e6 !important;
    }
    .next-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      margin: 0 auto;
      transition: opacity 0.2s;
    }
    .next-btn:hover { background: #0ea5e9; }
    .feedback {
      font-size: 1rem;
      font-weight: 600;
      min-height: 1.5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="scoreboard">
    <span>Score: <strong id="score" style="color:#10b981;">0</strong></span>
    <span>Streak: <strong id="streak" style="color:#38bdf8;">0</strong></span>
  </div>

  <span class="lang-badge" id="lang-badge">Language</span>

  <div class="idiom-box">
    <div class="literal-label">Literal Translation</div>
    <div class="idiom-text" id="idiom-display">Loading...</div>
    <div class="original-text" id="original-display"></div>
  </div>

  <div class="options-grid" id="options-container"></div>

  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Idiom ➔</button>
</div>

<!-- 1. Load the 100-idiom database -->
<script src="idioms.js"></script>

<!-- 2. Main Game Script -->
<script>
  // Web Audio Synthesizer
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === "correct") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
      osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.45);
    } else if (type === "wrong") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.setValueAtTime(130, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    }
  }

  let currentIdiom = null;
  let score = 0;
  let streak = 0;
  let unusedIdioms = [];

  function nextQuestion() {
    initAudio();
    document.getElementById("feedback").innerText = "";
    document.getElementById("next-btn").style.display = "none";

    // Refill the deck if exhausted
    if (unusedIdioms.length === 0) {
      unusedIdioms = [...IDIOM_POOL].sort(() => Math.random() - 0.5);
    }

    currentIdiom = unusedIdioms.pop();
    
    document.getElementById("lang-badge").innerText = currentIdiom.language;
    document.getElementById("idiom-display").innerText = currentIdiom.literal;
    document.getElementById("original-display").innerText = `Original phrase: "${currentIdiom.original}"`;

    const choices = [currentIdiom.meaning, ...currentIdiom.decoys].sort(() => Math.random() - 0.5);

    const container = document.getElementById("options-container");
    container.innerHTML = "";

    choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = choice;
      btn.onclick = () => selectAnswer(btn, choice);
      container.appendChild(btn);
    });
  }

  function selectAnswer(selectedBtn, chosenMeaning) {
    initAudio();
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => btn.disabled = true);

    const isCorrect = chosenMeaning === currentIdiom.meaning;
    const feedback = document.getElementById("feedback");

    if (isCorrect) {
      playSound("correct");
      selectedBtn.classList.add("correct");
      feedback.innerText = "🎉 Correct meaning!";
      feedback.style.color = "#10b981";
      streak++;
      score += 10 + (streak > 1 ? (streak - 1) * 2 : 0);
    } else {
      playSound("wrong");
      selectedBtn.classList.add("wrong");
      feedback.innerText = `Incorrect! Actual meaning: "${currentIdiom.meaning}"`;
      feedback.style.color = "#f43f5e";
      streak = 0;

      buttons.forEach(btn => {
        if (btn.innerText === currentIdiom.meaning) {
          btn.classList.add("correct");
        }
      });
    }

    document.getElementById("score").innerText = score;
    document.getElementById("streak").innerText = streak;
    document.getElementById("next-btn").style.display = "block";
  }

  nextQuestion();
</script>

</body>
</html>
