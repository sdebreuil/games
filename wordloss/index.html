

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Validation Game</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2rem;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .back-link {
      display: inline-block;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: left;
      width: 100%;
    }
    .back-link:hover { color: #38bdf8; }
    input[type="text"] {
      width: 80%;
      padding: 12px 16px;
      font-size: 1.2rem;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 0.15em;
      font-weight: bold;
      background: #0f172a;
      border: 2px solid #475569;
      color: #f8fafc;
      border-radius: 8px;
      outline: none;
      margin-bottom: 1rem;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .submit-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #0ea5e9; }
    .status {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      min-height: 1.5rem;
    }
    .found-list {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .word-badge {
      background: #334155;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="card">
  <a href="../" class="back-link">← Back to Arcade</a>
  
  <h2>🔤 Word Guess Challenge</h2>
  <p style="color:#94a3b8; font-size: 0.95rem;">Enter a valid English word:</p>

  <form id="word-form" onsubmit="checkWord(event)">
    <input type="text" id="word-input" autocomplete="off" autofocus placeholder="TYPE HERE" />
    <br>
    <button type="submit" class="submit-btn">Submit Guess</button>
  </form>

  <div class="status" id="status-msg"></div>

  <div class="found-list" id="found-words"></div>
</div>

<!-- 1. Load the Dictionary Data -->
<script src="dictionary.js"></script>

<!-- 2. Main Game Script -->
<script>
  const foundWords = new Set();

  function checkWord(event) {
    event.preventDefault();
    const input = document.getElementById("word-input");
    const status = document.getElementById("status-msg");
    const guess = input.value.trim().toLowerCase();

    if (!guess) return;

    if (foundWords.has(guess)) {
      status.innerText = `⚠️ You already found "${guess.toUpperCase()}"!`;
      status.style.color = "#f59e0b";
    } else if (VALID_WORDS.has(guess)) {
      foundWords.add(guess);
      status.innerText = `🎉 "${guess.toUpperCase()}" is a valid word!`;
      status.style.color = "#10b981";
      renderFoundWord(guess);
    } else {
      status.innerText = `❌ "${guess.toUpperCase()}" is not in the dictionary.`;
      status.style.color = "#f43f5e";
    }

    input.value = "";
    input.focus();
  }

  function renderFoundWord(word) {
    const list = document.getElementById("found-words");
    const badge = document.createElement("span");
    badge.className = "word-badge";
    badge.innerText = word.toUpperCase();
    list.prepend(badge);
  }
</script>

</body>
</html>
