

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>At A Loss For Words</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      user-select: none;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2rem;
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .back-link:hover { color: #38bdf8; }

    .newgame-badge {
      background: #334155;
      color: #38bdf8;
      border: 1px solid #475569;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .newgame-badge:hover {
      background: #475569;
      border-color: #38bdf8;
    }

    h1 {
      margin: 0 0 0.25rem 0;
      font-size: 1.8rem;
    }

    .sub {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }

    /* Live Game Stats */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.7);
      padding: 8px 16px;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid #334155;
    }
    .stat-val { color: #38bdf8; }

    /* Guess Tray */
    .guess-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 52px;
      padding: 6px;
      margin-bottom: 1rem;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px dashed #475569;
      align-items: center;
      transition: border-color 0.2s;
    }

    /* Active Rack */
    .rack-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 1.5rem;
      min-height: 52px;
      align-items: center;
    }

    /* Tile Animations & Styling */
    .tile {
      background: #0f172a;
      border: 2px solid #38bdf8;
      color: #f8fafc;
      width: 44px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: transform 0.1s, background-color 0.15s, border-color 0.15s;
    }

    .tile:hover {
      transform: translateY(-2px);
      border-color: #7dd3fc;
    }
    .tile:active { transform: translateY(1px); }

    .tile.bounce {
      animation: pop 0.15s ease-out;
    }

    .tile.in-guess {
      background: #38bdf8;
      color: #0f172a;
      border-color: #7dd3fc;
    }

    .tile-placeholder {
      width: 44px;
      height: 48px;
      border: 2px dashed #334155;
      border-radius: 8px;
      box-sizing: border-box;
    }

    /* Error Shake */
    .shake {
      animation: shakeTray 0.35s ease-in-out;
      border-color: #f43f5e !important;
    }

    @keyframes shakeTray {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    @keyframes pop {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes flipIn {
      0% { transform: rotateX(90deg); opacity: 0; }
      100% { transform: rotateX(0deg); opacity: 1; }
    }

    /* Controls */
    .btn-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 0.5rem;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    button:hover { background: #0ea5e9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .secondary-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
    }
    .secondary-btn:hover { background: #475569; }

    .done-btn {
      background: #10b981;
      color: #0f172a;
    }
    .done-btn:hover { background: #059669; }

    .giveup-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
    }
    .giveup-btn:hover {
      background: #334155;
      color: #f8fafc;
    }

    .status {
      margin-top: 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 1.4rem;
    }

    /* History & Badges */
    .history-container {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .history-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .pyramid-word {
      background: #334155;
      color: #38bdf8;
      font-family: monospace;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 6px;
      letter-spacing: 0.2em;
      animation: flipIn 0.3s ease-out;
    }

    /* Game Over Container */
    .solution-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: #0f172a;
      border: 1px dashed #475569;
      border-radius: 8px;
      text-align: center;
    }
    .solution-box h4 {
      margin: 0 0 8px 0;
      color: #38bdf8;
    }
    .solution-row {
      font-family: monospace;
      color: #94a3b8;
      font-weight: bold;
      letter-spacing: 0.2em;
      margin: 2px 0;
    }
    .score-breakdown {
      color: #cbd5e1;
      font-size: 0.9rem;
      margin: 10px 0;
    }

    @media (max-width: 480px) {
      .tile, .tile-placeholder {
        width: 38px;
        height: 44px;
        font-size: 1.2rem;
      }
      .card {
        padding: 1.25rem 0.75rem;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-bar">
    <a href="../" class="back-link">← Back to Arcade</a>
    <button class="newgame-badge" onclick="initGame()">🔄 New Word</button>
  </div>

  <h1>At A Loss For Words</h1>
  <div class="sub">
    Find words at each tier. Entering a shorter word drops you down and removes unused letters!
  </div>

  <!-- Real-time Stats -->
  <div class="stats-bar">
    <div>Score: <span id="score-display" class="stat-val">0</span></div>
    <div>Words at Rack Size: <span id="tier-counter" class="stat-val">0/0</span></div>
  </div>

  <div class="guess-container" id="guess-tray"></div>
  <div class="rack-container" id="tile-rack"></div>

  <div class="btn-group">
    <button type="button" id="submit-btn" onclick="submitWord()">Submit</button>
    <button type="button" class="secondary-btn" id="clear-btn" onclick="clearGuess()">Clear</button>
    <button type="button" class="secondary-btn" id="shuffle-btn" onclick="shuffleRack()">🔀 Shuffle</button>
    <button type="button" class="done-btn" id="done-btn" style="display:none;" onclick="endGame(true, 'cleared_early')">Done</button>
    <button type="button" class="giveup-btn" id="giveup-btn" onclick="endGame(false, 'surrendered')">Give Up</button>
  </div>

  <div class="status" id="status-msg"></div>
  <div class="history-container" id="player-history"></div>
  <div id="game-over-container" style="display:none;"></div>
</div>

<!-- Load Shared Local Master Dictionary -->
<script src="../shared/dictionary.js"></script>

<script>
  let currentChain = [];
  let rackTiles = [];
  let currentGuess = [];
  let userWords = [];
  let totalScore = 0;
  let isGameOver = false;

  const SCORE_VALUES = { 7: 70, 6: 50, 5: 35, 4: 20, 3: 10 };

  let ANAGRAM_MAP = new Map();
  let SEVEN_KEYS = [];
  let IS_INDEXED = false;

  const guessTrayEl = document.getElementById("guess-tray");
  const rackEl = document.getElementById("tile-rack");
  const statusEl = document.getElementById("status-msg");
  const historyEl = document.getElementById("player-history");
  const gameOverEl = document.getElementById("game-over-container");
  const scoreDisplayEl = document.getElementById("score-display");
  const tierCounterEl = document.getElementById("tier-counter");
  const submitBtn = document.getElementById("submit-btn");
  const clearBtn = document.getElementById("clear-btn");
  const shuffleBtn = document.getElementById("shuffle-btn");
  const doneBtn = document.getElementById("done-btn");
  const giveupBtn = document.getElementById("giveup-btn");

  function getSortedKey(word) {
    return word.toUpperCase().split("").sort().join("");
  }

  function buildAnagramIndex() {
    if (typeof VALID_WORDS === "undefined" || VALID_WORDS.size === 0) return false;
    ANAGRAM_MAP.clear();
    SEVEN_KEYS = [];

    for (let w of VALID_WORDS) {
      const len = w.length;
      if (len >= 3 && len <= 7) {
        const key = getSortedKey(w);
        const upper = w.toUpperCase();
        if (!ANAGRAM_MAP.has(key)) {
          ANAGRAM_MAP.set(key, [upper]);
        } else {
          ANAGRAM_MAP.get(key).push(upper);
        }
      }
    }

    for (let key of ANAGRAM_MAP.keys()) {
      if (key.length === 7) SEVEN_KEYS.push(key);
    }
    IS_INDEXED = true;
    return true;
  }

  function getSubKeys(key) {
    const subKeys = new Set();
    for (let i = 0; i < key.length; i++) {
      subKeys.add(key.slice(0, i) + key.slice(i + 1));
    }
    return Array.from(subKeys);
  }

  function solveChainFast(key, targetLen = 3) {
    if (key.length === targetLen) {
      const validWords = ANAGRAM_MAP.get(key);
      if (validWords && validWords.length > 0) {
        return [validWords[Math.floor(Math.random() * validWords.length)]];
      }
      return null;
    }

    const subKeys = getSubKeys(key).filter(k => ANAGRAM_MAP.has(k));
    shuffleArray(subKeys);

    for (let nextKey of subKeys) {
      const subChain = solveChainFast(nextKey, targetLen);
      if (subChain) {
        const words = ANAGRAM_MAP.get(key);
        const chosen = words[Math.floor(Math.random() * words.length)];
        return [chosen, ...subChain];
      }
    }
    return null;
  }

  function generateRandomPyramid() {
    if (!IS_INDEXED) {
      const success = buildAnagramIndex();
      if (!success) return null;
    }

    const keysCopy = [...SEVEN_KEYS];
    shuffleArray(keysCopy);

    for (let i = 0; i < Math.min(keysCopy.length, 50); i++) {
      const chain = solveChainFast(keysCopy[i], 3);
      if (chain) return chain;
    }
    return null;
  }

  function initGame() {
    isGameOver = false;
    userWords = [];
    currentGuess = [];
    totalScore = 0;
    scoreDisplayEl.innerText = "0";
    historyEl.innerHTML = "";
    gameOverEl.style.display = "none";
    gameOverEl.innerHTML = "";
    submitBtn.disabled = false;
    clearBtn.disabled = false;
    shuffleBtn.disabled = false;
    doneBtn.style.display = "none";
    doneBtn.disabled = false;
    giveupBtn.disabled = false;

    if (typeof VALID_WORDS === "undefined" || VALID_WORDS.size === 0) {
      setMsg("Loading shared dictionary...", "#94a3b8");
      setTimeout(initGame, 100);
      return;
    }

    currentChain = generateRandomPyramid();

    if (!currentChain) {
      setMsg("Generating puzzle...", "#94a3b8");
      setTimeout(initGame, 100);
      return;
    }

    const rootWord = currentChain[0];
    rackTiles = rootWord.split("").map((letter, idx) => ({
      id: idx,
      letter: letter,
      used: false
    }));

    shuffleArray(rackTiles);
    renderAll();
    updateTierCounter();
    setMsg("Tap letters or type to make 7-letter words! Drop down when ready.", "#38bdf8");
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function shuffleRack() {
    if (isGameOver) return;
    const available = rackTiles.filter(t => !t.used);
    shuffleArray(available);

    let availIdx = 0;
    rackTiles = rackTiles.map(t => {
      if (!t.used) return available[availIdx++];
      return t;
    });
    renderAll();
  }

  function renderAll() {
    renderGuessTray();
    renderRack();
  }

  function renderGuessTray() {
    guessTrayEl.innerHTML = "";
    if (currentGuess.length === 0) {
      const hint = document.createElement("span");
      hint.style.color = "#64748b";
      hint.style.fontSize = "0.95rem";
      hint.innerText = "Type or tap tiles";
      guessTrayEl.appendChild(hint);
      return;
    }

    currentGuess.forEach(tile => {
      const el = document.createElement("div");
      el.className = "tile in-guess bounce";
      el.innerText = tile.letter;
      el.onclick = () => returnTileToRack(tile);
      guessTrayEl.appendChild(el);
    });
  }

  function renderRack() {
    rackEl.innerHTML = "";
    rackTiles.forEach(tile => {
      if (tile.used) {
        const placeholder = document.createElement("div");
        placeholder.className = "tile-placeholder";
        rackEl.appendChild(placeholder);
      } else {
        const el = document.createElement("div");
        el.className = "tile";
        el.innerText = tile.letter;
        el.onclick = () => addTileToGuess(tile);
        rackEl.appendChild(el);
      }
    });
  }

  function addTileToGuess(tile) {
    if (isGameOver || tile.used) return;
    tile.used = true;
    currentGuess.push(tile);
    renderAll();
  }

  function returnTileToRack(tile) {
    if (isGameOver) return;
    tile.used = false;
    currentGuess = currentGuess.filter(t => t.id !== tile.id);
    renderAll();
  }

  function popLastTile() {
    if (currentGuess.length === 0) return;
    const lastTile = currentGuess.pop();
    lastTile.used = false;
    renderAll();
  }

  function clearGuess() {
    if (isGameOver || currentGuess.length === 0) return;
    currentGuess.forEach(t => t.used = false);
    currentGuess = [];
    renderAll();
  }

  function setMsg(txt, color) {
    statusEl.innerText = txt;
    statusEl.style.color = color;
  }

  function triggerError(msg) {
    setMsg(msg, "#f43f5e");
    guessTrayEl.classList.remove("shake");
    void guessTrayEl.offsetWidth;
    guessTrayEl.classList.add("shake");
  }

  function getPossibleWordsAtCurrentRack() {
    const key = getSortedKey(rackTiles.map(t => t.letter).join(""));
    return ANAGRAM_MAP.get(key) || [];
  }

  function updateTierCounter() {
    const allAtTier = getPossibleWordsAtCurrentRack();
    const foundAtTier = userWords.filter(w => w.length === rackTiles.length);
    tierCounterEl.innerText = `${foundAtTier.length}/${allAtTier.length}`;
  }

  function renderHistory() {
    historyEl.innerHTML = "";
    const groups = {};
    userWords.forEach(w => {
      const len = w.length;
      if (!groups[len]) groups[len] = [];
      groups[len].push(w);
    });

    const lengths = Object.keys(groups).map(Number).sort((a, b) => b - a);
    lengths.forEach(len => {
      const row = document.createElement("div");
      row.className = "history-row";
      groups[len].forEach(word => {
        const badge = document.createElement("span");
        badge.className = "pyramid-word";
        badge.innerText = `${word} (+${SCORE_VALUES[len] || 10})`;
        row.appendChild(badge);
      });
      historyEl.appendChild(row);
    });
  }

  function submitWord() {
    if (isGameOver) return;
    const guess = currentGuess.map(t => t.letter).join("");

    if (guess.length < 3) {
      triggerError("Words must be at least 3 letters long!");
      return;
    }

    if (guess.length > rackTiles.length) {
      triggerError(`Word cannot exceed current rack size (${rackTiles.length})!`);
      return;
    }

    if (userWords.includes(guess)) {
      triggerError(`You already entered "${guess}"!`);
      return;
    }

    if (typeof VALID_WORDS !== "undefined" && !VALID_WORDS.has(guess.toLowerCase())) {
      triggerError(`"${guess}" is not in the dictionary!`);
      return;
    }

    const pts = SCORE_VALUES[guess.length] || 10;
    totalScore += pts;
    scoreDisplayEl.innerText = totalScore;
    userWords.push(guess);
    renderHistory();

    const droppedSize = guess.length < rackTiles.length;
    if (droppedSize) {
      rackTiles = currentGuess.map((t, idx) => ({
        id: idx,
        letter: t.letter,
        used: false
      }));
      shuffleArray(rackTiles);
    } else {
      rackTiles.forEach(t => t.used = false);
    }

    currentGuess = [];
    renderAll();
    updateTierCounter();

    if (rackTiles.length === 3) {
      doneBtn.style.display = "inline-block";
      const remainingThree = getPossibleWordsAtCurrentRack().filter(w => !userWords.includes(w));

      if (remainingThree.length === 0) {
        endGame(true, "all_found");
        return;
      } else {
        setMsg(`+${pts} pts! Found ${remainingThree.length} more possible 3-letter word(s). Click Done anytime.`, "#10b981");
      }
    } else {
      if (droppedSize) {
        setMsg(`+${pts} pts! Dropped to ${rackTiles.length} letters. Unused tiles removed.`, "#10b981");
      } else {
        setMsg(`+${pts} pts! Accepted "${guess}".`, "#10b981");
      }
    }
  }

  function endGame(cleared, reason) {
    isGameOver = true;
    submitBtn.disabled = true;
    clearBtn.disabled = true;
    shuffleBtn.disabled = true;
    doneBtn.disabled = true;
    giveupBtn.disabled = true;

    let message = "";
    if (reason === "all_found") {
      message = `🎉 Cleared all 3-letter words! Final Score: ${totalScore} pts (${userWords.length} words).`;
    } else if (reason === "cleared_early") {
      message = `🏁 Pyramid Finished! Final Score: ${totalScore} pts (${userWords.length} words).`;
    } else {
      message = `Game Over! Final Score: ${totalScore} pts (${userWords.length} words).`;
    }

    setMsg(message, cleared ? "#10b981" : "#f59e0b");

    let solutionHTML = `
      <div class="solution-box">
        <h4>Target Solution Chain</h4>
        ${currentChain.map(w => `<div class="solution-row">${w}</div>`).join("")}
        <div class="score-breakdown">Total Score: <strong>${totalScore} pts</strong> across <strong>${userWords.length}</strong> words.</div>
        <button style="margin-top:8px;" onclick="initGame()">Play Another Word</button>
      </div>
    `;
    gameOverEl.innerHTML = solutionHTML;
    gameOverEl.style.display = "block";
  }

  // Keyboard support
  window.addEventListener("keydown", (e) => {
    if (isGameOver) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === "Enter") {
      e.preventDefault();
      submitWord();
    } else if (e.key === "Backspace" || e.key === "Delete") {
      e.preventDefault();
      popLastTile();
    } else if (e.key === "Escape") {
      e.preventDefault();
      clearGuess();
    } else if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
      const char = e.key.toUpperCase();
      const matchingTile = rackTiles.find(t => !t.used && t.letter === char);
      if (matchingTile) {
        addTileToGuess(matchingTile);
      }
    }
  });

  initGame();
</script>

</body>
</html>
