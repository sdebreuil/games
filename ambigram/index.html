

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letter Recognition Word Finder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --success: #4ade80;
      --muted: #94a3b8;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
    }

    .game-card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      width: min(90vw, 420px);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    #word-counter {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .slots-container {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.5rem 0;
    }

    .slot {
      width: 55px;
      height: 65px;
      border: 2px dashed #475569;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      background: rgba(255, 255, 255, 0.03);
    }

    .slot.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    #game-status {
      min-height: 1.5em;
      font-size: 0.95rem;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      min-height: 38px;
    }

    .tag {
      background: #334155;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--success);
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div id="word-counter">0 of 6 words found</div>

    <!-- 4-Letter Slot Preview -->
    <div class="slots-container">
      <div class="slot" id="slot-0"></div>
      <div class="slot" id="slot-1"></div>
      <div class="slot" id="slot-2"></div>
      <div class="slot" id="slot-3"></div>
    </div>

    <div id="game-status">Initializing dictionary...</div>
    <div class="word-list" id="found-list"></div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURATION & TOLERANCES ("GRACE")
    // ==========================================
    const DICTIONARY_PATH = '../shared/dictionary.js';
    const TARGET_GOAL = 6;
    const WORD_LENGTH = 4;
    const GRACE_WINDOW_MS = 600;
    const MIN_CONFIDENCE = 0.55;

    // Visual lookalikes / OCR confusion aliases
    const CHAR_ALIASES = {
      '0': 'O',
      '1': 'I',
      '|': 'I',
      'l': 'I',
      '5': 'S',
      '8': 'B',
      '2': 'Z',
      'V': 'U'
    };

    // ==========================================
    // 2. STATE MANAGEMENT
    // ==========================================
    let validDictionary = new Set();
    const foundWords = new Set();
    let currentBuffer = [];
    let recognitionTimer = null;
    let isDictionaryLoaded = false;

    // ==========================================
    // 3. DICTIONARY LOADER
    // ==========================================
    async function loadSharedDictionary(path = DICTIONARY_PATH) {
      try {
        updateStatus('Loading dictionary...');
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Failed to load ${path}`);
        }

        const contentType = response.headers.get('content-type') || '';
        let rawWords = [];

        if (contentType.includes('application/json') || path.endsWith('.json')) {
          rawWords = await response.json();
        } else {
          const text = await response.text();
          rawWords = text.split(/\r?\n/);
        }

        validDictionary = new Set(
          rawWords
            .map(w => w.trim().toUpperCase())
            .filter(w => w.length === WORD_LENGTH && /^[A-Z]+$/.test(w))
        );

        isDictionaryLoaded = true;
        updateStatus('Ready! Start spelling words.');
        renderProgress();
      } catch (error) {
        console.error('Error loading shared dictionary:', error);
        updateStatus('Could not load dictionary. Check path in /shared.');
      }
    }

    // ==========================================
    // 4. INPUT PROCESSING (ENGINE HOOK)
    // ==========================================
    function normalizeChar(rawChar) {
      if (!rawChar) return '';
      const upper = rawChar.toUpperCase();
      return CHAR_ALIASES[upper] || upper;
    }

    // Call this function from your letter recognition or OCR engine:
    // window.handleIncomingChar('A', 0.92);
    window.handleIncomingChar = function(char, confidence = 1.0) {
      if (!isDictionaryLoaded) return;
      if (confidence < MIN_CONFIDENCE) return;

      const normalized = normalizeChar(char);
      if (!/^[A-Z]$/.test(normalized)) return;

      currentBuffer.push(normalized);
      renderSlots();

      clearTimeout(recognitionTimer);
      recognitionTimer = setTimeout(processBuffer, GRACE_WINDOW_MS);
    };

    // Keyboard fallback for testing directly in your browser:
    window.addEventListener('keydown', (e) => {
      if (/^[a-zA-Z0-9]$/.test(e.key)) {
        handleIncomingChar(e.key, 1.0);
      }
    });

    // ==========================================
    // 5. WORD VALIDATION
    // ==========================================
    function processBuffer() {
      const candidate = currentBuffer.slice(-WORD_LENGTH).join('');

      if (candidate.length === WORD_LENGTH) {
        validateCandidate(candidate);
      }
    }

    function validateCandidate(word) {
      if (validDictionary.has(word)) {
        if (!foundWords.has(word)) {
          foundWords.add(word);
          appendFoundTag(word);
          updateStatus(`Nice! "${word}" accepted.`);
          currentBuffer = [];
          renderSlots();
        } else {
          updateStatus(`"${word}" was already found.`);
        }
      } else {
        updateStatus(`"${word}" isn't in the dictionary.`);
      }

      renderProgress();
    }

    // ==========================================
    // 6. UI UPDATES
    // ==========================================
    function renderProgress() {
      const counterElement = document.getElementById('word-counter');
      if (counterElement) {
        counterElement.textContent = `${foundWords.size} of ${TARGET_GOAL} words found`;
      }

      if (foundWords.size >= TARGET_GOAL) {
        updateStatus(`Goal reached! All ${TARGET_GOAL} words found!`);
      }
    }

    function renderSlots() {
      const lastFour = currentBuffer.slice(-WORD_LENGTH);
      for (let i = 0; i < WORD_LENGTH; i++) {
        const slot = document.getElementById(`slot-${i}`);
        const char = lastFour[i] || '';
        slot.textContent = char;
        slot.classList.toggle('active', Boolean(char));
      }
    }

    function appendFoundTag(word) {
      const list = document.getElementById('found-list');
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = word;
      list.appendChild(tag);
    }

    function updateStatus(message) {
      const statusElement = document.getElementById('game-status');
      if (statusElement) statusElement.textContent = message;
    }

    // Run initialization
    loadSharedDictionary();
  </script>
</body>
</html>
